<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

const SCENARIOS = [

    title:'Ethical Governance & Digital Foundations',

    context:"A school head has received the term's attendance and assessment data from their SMS and must move from reading the data to acting on it strategically.",
    starterPrompt:"Your SMS shows 23% of Grade 8 learners have attendance below 70% correlating with below-average performance in three subjects. What do you do with this information — and what would you do differently if you did not have it?",
    masteryThreshold:75, afl:'Formative Checkpoint: Data-Informed Leadership',

    context:"A school head is preparing to defend their Final Strategic Master Plan before a KNQA review panel and must demonstrate evidence-based, grounded strategic thinking.",
    starterPrompt:"Your Strategic Master Plan projects 40% improvement in learner outcomes over three years. A KNQA reviewer asks: 'What is your evidence base for that projection, and what happens to your plan if the evidence does not materialise?' How do you respond?",
    masteryThreshold:80, afl:'Final AfL Gate: Strategic Mastery',

function buildSystemPrompt(scenario, masteryScore) {
  return `You are the Growth Circles Socratic Coaching Engine — an AI assessment intelligence embedded in The Instructional Architect professional diploma for school leaders in Kenya.

Your role is NOT to teach. Your role is to PROBE, CHALLENGE, and ASSESS genuine understanding of: ${scenario.topic}.

CONTEXT: ${scenario.context}

RULES:
1. One focused Socratic question per turn — never more.
2. Surface answers get probed deeper: "What makes you say that?", "What would change if...?", "What is the assumption underneath that claim?"
3. Strong answers get brief acknowledgement then raised complexity.
4. Keep your coaching response to 2–4 sentences + one question.
5. Never accept vague or purely theoretical answers without pushing back to the specific school context.

CURRENT MASTERY: ${masteryScore}/100  |  AfL GATE AT: ${scenario.masteryThreshold}/100

After EVERY candidate response, end with this JSON on its own line (nothing after it):
{"mastery": <0-100>, "verdict": "<probing|developing|strong|gate_ready>", "coach_note": "<one honest sentence about this specific response>"}

verdict: probing=surface level | developing=understanding emerging | strong=raise complexity | gate_ready=mastery threshold met (only when mastery >= ${scenario.masteryThreshold})

TONE: Direct. Intellectually rigorous. Warm but unrelenting.`;
}

function parseResponse(raw) {
  const jsonMatch = raw.match(/\{[^{}]*"mastery"[^{}]*\}/);
  let meta = null, clean = raw.trim();
  if (jsonMatch) {
    try { meta = JSON.parse(jsonMatch[0]); clean = raw.replace(jsonMatch[0], '').trim(); }
    catch(e) {}
  }
  return { clean, meta };
}

// ── GC Logo ───────────────────────────────────────────────────────

// ── API Key Gate Screen ───────────────────────────────────────────
function ApiKeyGate({ onSubmit }) {
  const [key, setKey] = useState('');
  const [err, setErr] = useState('');
  const [testing, setTesting] = useState(false);

  const handleSubmit = async () => {
    const trimmed = key.trim();
    if (!trimmed.startsWith('sk-ant-')) {
      setErr('That does not look like a valid Anthropic API key. Keys begin with "sk-ant-".');
      return;
    }
    setTesting(true);
    setErr('');
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'x-api-key':trimmed, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
        body:JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:20, messages:[{role:'user',content:'Reply with the single word: ready'}] }),
      });
      if (res.status === 401) { setErr('Invalid API key — authentication failed. Please check the key and try again.'); setTesting(false); return; }
      if (res.status === 403) { setErr('This API key does not have permission to access this model. Check your Anthropic account plan.'); setTesting(false); return; }
      if (!res.ok) { setErr(`API returned status ${res.status}. Please check the key and your Anthropic account.`); setTesting(false); return; }
      onSubmit(trimmed);
    } catch(e) {
      setErr('Could not reach the Anthropic API. Check your internet connection and try again.');
    }
    setTesting(false);
  };

  const noiseBg = { position:'fixed', inset:0, backgroundImage:`url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")`, opacity:0.25, pointerEvents:'none', zIndex:0 };

  return (
    <div style={{ minHeight:'100vh', position:'relative', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
      <div style={noiseBg}/>
      <div style={{ position:'relative', zIndex:1, width:'100%', maxWidth:540 }}>

        {/* Logo + brand */}
        <div style={{ display:'flex', alignItems:'center', gap:14, marginBottom:44, animation:'fadeUp 0.6s 0.05s ease both' }}>
          <GCLogo size={44}/>
          <div>
            <div style={{ fontFamily:"'Cormorant Garamond',Georgia,serif", fontSize:16, fontWeight:700, color:C.white, lineHeight:1.2 }}>Growth Circles with TechForHer</div>
            <div style={{ fontFamily:"'DM Mono','Courier New',monospace", fontSize:9, color:C.gold, letterSpacing:'0.18em', textTransform:'uppercase', marginTop:3 }}>Socratic AI Coaching Engine</div>
          </div>
        </div>

        {/* Card */}
        <div style={{ background:'#0A1628', border:'1px solid rgba(61,135,204,0.2)', borderTop:`4px solid ${C.gold}`, padding:40, animation:'fadeUp 0.6s 0.2s ease both' }}>

          <div style={{ fontFamily:"'Cormorant Garamond',Georgia,serif", fontSize:28, fontWeight:700, color:C.white, marginBottom:10, lineHeight:1.2 }}>
            Enter Your API Key
          </div>
          <p style={{ fontSize:13, fontWeight:300, color:C.muted, lineHeight:1.8, marginBottom:28 }}>
            This demo calls the Anthropic API directly from your browser. Your key is used only for this session and is never stored or sent anywhere other than Anthropic's servers.
          </p>

          {/* Key input */}
          <div style={{ marginBottom:16 }}>
            <label style={{ display:'block', fontFamily:"'DM Mono','Courier New',monospace", fontSize:10, fontWeight:500, letterSpacing:'0.18em', textTransform:'uppercase', color:C.steel, marginBottom:8 }}>
              Anthropic API Key
            </label>
            <input
              type="password"
              value={key}
              onChange={e => { setKey(e.target.value); setErr(''); }}
              onKeyDown={e => { if(e.key==='Enter') handleSubmit(); }}
              placeholder="sk-ant-api03-..."
              style={{
                width:'100%', padding:'12px 16px',
                background:'rgba(8,15,30,0.8)', color:C.text,
                border:`1px solid ${err ? C.error : 'rgba(61,135,204,0.25)'}`,
                fontFamily:"'DM Mono','Courier New',monospace", fontSize:13,
                transition:'border-color 0.2s',
              }}
            />
            {err && (
              <div style={{ marginTop:8, padding:'10px 14px', background:C.errorBg, border:`1px solid rgba(239,68,68,0.25)`, borderLeft:`3px solid ${C.error}`, fontFamily:"'DM Mono','Courier New',monospace", fontSize:11, color:'#FCA5A5', lineHeight:1.6 }}>
                {err}
              </div>
            )}
          </div>

          {/* Submit */}
          <button onClick={handleSubmit} disabled={!key.trim() || testing}
            style={{
              width:'100%', padding:'13px 0',
              background: (!key.trim()||testing) ? 'rgba(201,168,76,0.3)' : C.gold,
              color:C.navy, fontFamily:"'DM Sans','Segoe UI',sans-serif",
              fontSize:12, fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase',
              border:'none', transition:'background 0.2s',
              display:'flex', alignItems:'center', justifyContent:'center', gap:10,
              cursor: (!key.trim()||testing) ? 'not-allowed' : 'pointer',
            }}
            onMouseEnter={e=>{ if(key.trim()&&!testing) e.currentTarget.style.background=C.goldL; }}
            onMouseLeave={e=>{ e.currentTarget.style.background=(!key.trim()||testing)?'rgba(201,168,76,0.3)':C.gold; }}>
            {testing ? (
              <>
                <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke={C.navy} strokeWidth={2.5} style={{ animation:'spin 0.8s linear infinite' }}>
                  <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                </svg>
                Verifying Key…
              </>
            ) : (
              <>
                Launch Demo
                <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke={C.navy} strokeWidth={2.5}>
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </>
            )}
          </button>

          {/* How to get key */}
          <div style={{ marginTop:24, padding:'14px 16px', background:'rgba(201,168,76,0.04)', border:'1px solid rgba(201,168,76,0.14)', borderLeft:`3px solid ${C.goldD}` }}>
            <div style={{ fontFamily:"'DM Mono','Courier New',monospace", fontSize:9, fontWeight:500, letterSpacing:'0.2em', textTransform:'uppercase', color:C.goldD, marginBottom:8 }}>
              Don't have a key?
            </div>
            <div style={{ fontSize:12, fontWeight:300, color:C.muted, lineHeight:1.75 }}>
              Get a free API key at{' '}
              <a href="https://console.anthropic.com" target="_blank" style={{ color:C.sky }}>console.anthropic.com</a>.
              New accounts receive free credits. The demo uses approximately 500–1,000 tokens per coaching exchange.
            </div>
          </div>

          {/* Privacy note */}
          <div style={{ marginTop:12, fontFamily:"'DM Mono','Courier New',monospace", fontSize:9, color:'rgba(168,200,232,0.3)', lineHeight:1.65, letterSpacing:'0.03em' }}>
            Your API key is held in memory only for this browser session. It is never stored, logged, or transmitted to any server other than api.anthropic.com. Closing or refreshing this page clears it permanently.
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Mastery Meter ─────────────────────────────────────────────────
function MasteryMeter({ score, threshold, verdict }) {
  const r=52, circ=2*Math.PI*r;
  const filled=(score/100)*circ;
  const arcColor = verdict==='gate_ready'?C.green:verdict==='strong'?C.goldL:verdict==='developing'?C.sky:C.steel;
  return (
    <div style={{ position:'relative', width:136, height:136, flexShrink:0 }}>
      <svg width={136} height={136} viewBox="0 0 136 136">
        <circle cx={68} cy={68} r={r} fill="none" stroke="rgba(61,135,204,0.1)" strokeWidth={10}/>
        <circle cx={68} cy={68} r={r} fill="none" stroke={C.goldD} strokeWidth={2}
          strokeDasharray={`3 ${circ-3}`}
          strokeDashoffset={-(threshold/100)*circ+circ*0.25}
          style={{transform:'rotate(-90deg)',transformOrigin:'68px 68px'}}/>
        <circle cx={68} cy={68} r={r} fill="none" stroke={arcColor} strokeWidth={10}
          strokeDasharray={`${filled} ${circ-filled}`}
          strokeDashoffset={circ*0.25} strokeLinecap="round"
          style={{transform:'rotate(-90deg)',transformOrigin:'68px 68px',transition:'stroke-dasharray 0.8s cubic-bezier(0.4,0,0.2,1),stroke 0.4s'}}/>
        <text x={68} y={62} textAnchor="middle" fontSize={26} fontWeight={700} fill={arcColor}
          fontFamily="'Cormorant Garamond',Georgia,serif" style={{transition:'fill 0.4s'}}>{score}</text>
        <text x={68} y={78} textAnchor="middle" fontSize={10} fill="rgba(168,200,232,0.4)"
          fontFamily="'DM Mono','Courier New',monospace">/ 100</text>
        <text x={68} y={93} textAnchor="middle" fontSize={8} fill="rgba(168,200,232,0.3)"
          letterSpacing={1} fontFamily="'DM Mono','Courier New',monospace">MASTERY</text>
      </svg>
      <div style={{textAlign:'center',marginTop:4,fontFamily:"'DM Mono','Courier New',monospace",fontSize:8,color:C.goldD,letterSpacing:'0.14em'}}>GATE AT {threshold}</div>
    </div>
  );
}

function VerdictBadge({ verdict }) {
  const map = {
    probing:   {label:'Probing',   bg:'rgba(46,107,176,0.15)', border:'rgba(46,107,176,0.4)', color:C.sky},
    developing:{label:'Developing',bg:'rgba(61,135,204,0.12)', border:'rgba(61,135,204,0.35)',color:C.ice},
    strong:    {label:'Strong',    bg:'rgba(201,168,76,0.12)', border:'rgba(201,168,76,0.4)', color:C.goldL},
    gate_ready:{label:'Gate Ready',bg:'rgba(34,197,94,0.12)',  border:'rgba(34,197,94,0.5)',  color:C.green},
  };
  const v=map[verdict]||map.probing;
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 12px',background:v.bg,border:`1px solid ${v.border}`,fontFamily:"'DM Mono','Courier New',monospace",fontSize:10,fontWeight:500,letterSpacing:'0.18em',textTransform:'uppercase',color:v.color,transition:'all 0.3s'}}>
      <span style={{width:6,height:6,borderRadius:'50%',background:v.color,display:'inline-block',animation:verdict==='gate_ready'?'pulse 1.5s ease infinite':'none'}}/>
      {v.label}
    </span>
  );
}

function TypingIndicator() {
  return (

      {[0,1,2].map(i=><span key={i} style={{width:7,height:7,borderRadius:'50%',background:C.gold,display:'inline-block',animation:`bounce 1.2s ease ${i*0.2}s infinite`}}/>)}

    </div>
  );
}

function Bubble({ role, content, coachNote }) {
  const isCoach=role==='assistant';
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:isCoach?'flex-start':'flex-end',marginBottom:20,animation:'slideIn 0.35s ease'}}>
      <div style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:9,fontWeight:500,letterSpacing:'0.22em',textTransform:'uppercase',color:isCoach?C.gold:C.sky,marginBottom:6,paddingLeft:isCoach?4:0,paddingRight:isCoach?0:4}}>
        {isCoach?'Socratic Coach':'You'}
      </div>
      <div style={{maxWidth:'86%',padding:'16px 20px',background:isCoach?'linear-gradient(135deg,rgba(10,22,40,0.95) 0%,rgba(18,32,64,0.8) 100%)':'rgba(26,58,107,0.35)',border:isCoach?`1px solid rgba(201,168,76,0.2)`:`1px solid rgba(61,135,204,0.25)`,borderLeft:isCoach?`3px solid ${C.gold}`:undefined,borderRight:isCoach?undefined:`3px solid ${C.sky}`,fontFamily:"'DM Sans','Segoe UI',sans-serif",fontSize:14,fontWeight:300,color:C.text,lineHeight:1.8,whiteSpace:'pre-wrap'}}>
        {content}
      </div>
      {isCoach&&coachNote&&(
        <div style={{maxWidth:'86%',marginTop:6,padding:'8px 14px',background:'rgba(201,168,76,0.05)',border:'1px solid rgba(201,168,76,0.15)',fontFamily:"'DM Mono','Courier New',monospace",fontSize:10,color:C.goldD,lineHeight:1.6,letterSpacing:'0.04em'}}>
          ✦ Coach note: {coachNote}
        </div>
      )}
    </div>
  );
}

      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12,fontFamily:"'DM Mono','Courier New',monospace",fontSize:10,fontWeight:500,letterSpacing:'0.25em',textTransform:'uppercase',color:C.green}}>
        <span style={{width:8,height:8,borderRadius:'50%',background:C.green,animation:'pulse 1.5s ease infinite',display:'inline-block'}}/>

        <svg width={32} height={32} viewBox="0 0 24 24" fill="none" stroke={C.green} strokeWidth={1.5}>

}

function KolbTracker({ mastery }) {
  const stages=[{label:'Concrete Experience',color:C.goldL},{label:'Reflective Observation',color:C.sky},{label:'Abstract Conceptualisation',color:C.tealL},{label:'Active Experimentation',color:C.green}];
  const active=Math.min(Math.floor(mastery/25),3);
  return (
    <div>
      <div style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:9,fontWeight:500,letterSpacing:'0.18em',textTransform:'uppercase',color:C.steel,marginBottom:12}}>Kolb's Cycle</div>
      {stages.map((s,i)=>(
        <div key={i} style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:9,transition:'opacity 0.4s',opacity:i<=active?1:0.25}}>
          <span style={{width:7,height:7,borderRadius:'50%',flexShrink:0,marginTop:3,background:i<=active?s.color:'rgba(168,200,232,0.2)',transition:'background 0.4s'}}/>
          <span style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:9,lineHeight:1.4,color:i<=active?s.color:C.muted,transition:'color 0.4s'}}>{s.label}</span>
        </div>
      ))}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════════════════════════
function App() {
  const [apiKey, setApiKey]         = useState('');
  const [screen, setScreen]         = useState('intro'); // intro | coaching
  const [scenario, setScenario]     = useState(null);
  const [messages, setMessages]     = useState([]);
  const [input, setInput]           = useState('');
  const [mastery, setMastery]       = useState(0);
  const [verdict, setVerdict]       = useState('probing');
  const [coachNotes, setCoachNotes] = useState({});
  const [showNotes, setShowNotes]   = useState(false);
  const [loading, setLoading]       = useState(false);
  const [gateOpen, setGateOpen]     = useState(false);
  const [turns, setTurns]           = useState(0);
  const [error, setError]           = useState('');
  const chatRef  = useRef(null);
  const inputRef = useRef(null);

  useEffect(()=>{ if(chatRef.current) chatRef.current.scrollTop=chatRef.current.scrollHeight; },[messages,loading,gateOpen]);
  useEffect(()=>{ if(inputRef.current){ inputRef.current.style.height='auto'; inputRef.current.style.height=Math.min(inputRef.current.scrollHeight,140)+'px'; } },[input]);

  const callAPI = useCallback(async (msgs, currentMastery) => {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:800,
        system:buildSystemPrompt(scenario, currentMastery),
        messages: msgs,
      }),
    });
    if (!res.ok) {
      if (res.status===401) throw new Error('API key invalid or expired. Please refresh and enter a valid key.');
      if (res.status===429) throw new Error('Rate limit reached. Please wait a moment and try again.');
      throw new Error(`API error (${res.status}). Please try again.`);
    }
    return res.json();
  }, [apiKey, scenario]);

  const startScenario = useCallback(async (sc) => {
    setScenario(sc);
    setMessages([]); setMastery(0); setVerdict('probing');
    setCoachNotes({}); setShowNotes(false); setGateOpen(false);
    setTurns(0); setError(''); setScreen('coaching'); setLoading(true);
    try {
      const data = await callAPI([{
        role:'user',
        content:`[Open the coaching session by delivering this prompt directly — do not introduce yourself, begin immediately. Append your JSON assessment block on a new line at the end.]\n\nOpening prompt: "${sc.starterPrompt}"`,
      }], 0);
      const raw = data.content?.[0]?.text||'';
      const {clean,meta} = parseResponse(raw);
      setMessages([{role:'assistant',content:clean}]);
      if(meta){setMastery(meta.mastery||0);setVerdict(meta.verdict||'probing');setCoachNotes({0:meta.coach_note});}
    } catch(e){ setError(e.message); }
    setLoading(false);
  }, [callAPI]);

  const sendMessage = useCallback(async () => {
    if(!input.trim()||loading||gateOpen) return;
    const userText=input.trim(); setInput(''); setError('');
    setTurns(t=>t+1);
    const updatedMsgs=[...messages,{role:'user',content:userText}];
    setMessages(updatedMsgs); setLoading(true);
    try {
      const data = await callAPI(updatedMsgs.map(m=>({role:m.role,content:m.content})), mastery);
      const raw=data.content?.[0]?.text||'';
      const {clean,meta}=parseResponse(raw);
      const newIdx=updatedMsgs.length;
      setMessages(prev=>[...prev,{role:'assistant',content:clean}]);
      if(meta){
        const nm=meta.mastery||mastery, nv=meta.verdict||'probing';
        setMastery(nm); setVerdict(nv);
        if(meta.coach_note) setCoachNotes(prev=>({...prev,[newIdx]:meta.coach_note}));
        if(nv==='gate_ready'&&nm>=scenario.masteryThreshold){
          setTimeout(()=>{setGateOpen(true);setShowNotes(true);},800);
        }
      }
    } catch(e){ setError(e.message); }
    setLoading(false);
  },[input,loading,gateOpen,messages,mastery,scenario,callAPI]);

  const handleKey=(e)=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} };
  const resetToIntro=()=>{ setScreen('intro');setScenario(null);setMessages([]);setGateOpen(false);setShowNotes(false);setMastery(0);setVerdict('probing');setError(''); };

  const noiseBg={position:'fixed',inset:0,backgroundImage:`url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")`,opacity:0.25,pointerEvents:'none',zIndex:0};

  // ── No API key yet ──────────────────────────────────────────────
  if (!apiKey) return <ApiKeyGate onSubmit={k => setApiKey(k)}/>;

  // ── Intro / Scenario Selector ───────────────────────────────────
  if (screen==='intro') return (
    <div style={{minHeight:'100vh',position:'relative',background:C.navy}}>
      <div style={noiseBg}/>
      <div style={{position:'relative',zIndex:1,maxWidth:860,margin:'0 auto',padding:'52px 24px 80px'}}>

        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:48,flexWrap:'wrap',gap:12,animation:'fadeUp 0.6s 0.05s ease both'}}>
          <div style={{display:'flex',alignItems:'center',gap:14}}>
            <GCLogo size={48}/>
            <div>
              <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:17,fontWeight:700,color:C.white,lineHeight:1.2}}>Growth Circles with TechForHer</div>
              <div style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:9,color:C.gold,letterSpacing:'0.18em',textTransform:'uppercase',marginTop:3}}>Socratic AI Coaching Engine — Live Demo</div>
            </div>
          </div>
          <button onClick={()=>setApiKey('')} style={{background:'transparent',border:`1px solid rgba(61,135,204,0.2)`,padding:'6px 14px',fontFamily:"'DM Mono','Courier New',monospace",fontSize:9,letterSpacing:'0.14em',textTransform:'uppercase',color:C.muted,transition:'color 0.2s,border-color 0.2s'}}
            onMouseEnter={e=>{e.currentTarget.style.color=C.white;e.currentTarget.style.borderColor='rgba(168,200,232,0.4)';}}
            onMouseLeave={e=>{e.currentTarget.style.color=C.muted;e.currentTarget.style.borderColor='rgba(61,135,204,0.2)';}}>
            Change Key
          </button>
        </div>

        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14,animation:'fadeUp 0.6s 0.15s ease both'}}>
          <span style={{width:26,height:1,background:C.gold,display:'inline-block'}}/>
          <span style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:10,fontWeight:500,letterSpacing:'0.28em',textTransform:'uppercase',color:C.gold}}>The Assessment Engine</span>
        </div>

        <h1 style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:'clamp(36px,6vw,64px)',fontWeight:700,color:C.white,lineHeight:1.03,letterSpacing:'-0.01em',marginBottom:18,animation:'fadeUp 0.7s 0.22s ease both'}}>
          The Coach That<br/><em style={{fontStyle:'italic',color:C.goldL}}>Refuses to Be Fooled.</em>
        </h1>

        <p style={{fontSize:15,fontWeight:300,color:C.muted,lineHeight:1.9,maxWidth:600,marginBottom:48,animation:'fadeUp 0.6s 0.3s ease both'}}>
          A live demonstration of the Socratic coaching engine embedded in every phase of The Instructional Architect diploma.
          The AI does not teach. It questions, challenges, and probes until it is satisfied that you genuinely understand — or it refuses to let you advance.
        </p>

        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:2,marginBottom:52,animation:'fadeUp 0.6s 0.38s ease both'}}>
          {[
            {n:'01',t:'Choose a Phase',d:'Select a checkpoint from The Instructional Architect. Each is a real assessment moment in the programme.'},
            {n:'02',t:'Enter the Session',d:'The AI coach opens with a genuine assessment prompt. No small talk — coaching begins immediately.'},
            {n:'03',t:'Earn the Gate',d:'The AfL gate unlocks only when the coach is satisfied with your depth of understanding.'},
          ].map(item=>(
            <div key={item.n} style={{background:'rgba(10,22,40,0.7)',padding:'22px 18px',borderTop:`2px solid ${C.goldD}`}}>
              <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:36,fontWeight:700,color:'rgba(201,168,76,0.16)',lineHeight:1,marginBottom:10}}>{item.n}</div>
              <div style={{fontSize:13,fontWeight:600,color:C.ice,marginBottom:5}}>{item.t}</div>
              <div style={{fontSize:12,fontWeight:300,color:C.muted,lineHeight:1.65}}>{item.d}</div>
            </div>
          ))}
        </div>

        <div style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:10,fontWeight:500,letterSpacing:'0.25em',textTransform:'uppercase',color:C.steel,marginBottom:14,animation:'fadeUp 0.6s 0.46s ease both'}}>
          Select a Phase Checkpoint
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:2,animation:'fadeUp 0.6s 0.52s ease both'}}>
          {SCENARIOS.map(sc=>(
            <button key={sc.id} onClick={()=>startScenario(sc)}
              style={{background:'#0A1628',border:'1px solid rgba(61,135,204,0.15)',borderLeft:`4px solid ${sc.phaseColor}`,padding:'20px 22px',cursor:'pointer',color:C.text,display:'flex',alignItems:'center',gap:18,textAlign:'left',transition:'background 0.2s,border-color 0.2s',width:'100%'}}
              onMouseEnter={e=>{e.currentTarget.style.background='#0d1e38';e.currentTarget.style.borderColor='rgba(201,168,76,0.3)';}}
              onMouseLeave={e=>{e.currentTarget.style.background='#0A1628';e.currentTarget.style.borderColor='rgba(61,135,204,0.15)';}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:9,fontWeight:500,letterSpacing:'0.18em',textTransform:'uppercase',color:sc.phaseColor,marginBottom:4}}>{sc.phase}</div>
                <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:19,fontWeight:700,color:C.white,lineHeight:1.2,marginBottom:4}}>{sc.title}</div>
                <div style={{fontSize:12,fontWeight:300,color:C.muted,lineHeight:1.55}}>{sc.context}</div>
              </div>
              <svg width={17} height={17} viewBox="0 0 24 24" fill="none" stroke={C.gold} strokeWidth={1.5} style={{flexShrink:0}}><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          ))}
        </div>

        <div style={{marginTop:40,padding:'13px 16px',background:'rgba(201,168,76,0.04)',border:'1px solid rgba(201,168,76,0.14)',borderLeft:`3px solid ${C.goldD}`,fontFamily:"'DM Mono','Courier New',monospace",fontSize:9,color:C.goldD,lineHeight:1.75,letterSpacing:'0.04em',animation:'fadeUp 0.6s 0.6s ease both'}}>

          LIVE DEMO — This uses the actual Socratic coaching engine from The Instructional Architect programme. Responses are generated in real time using your API key. No data is stored. Mastery scores demonstrate programme mechanics, not formal assessment outcomes.
        </div>
      </div>
    </div>
  );

  // ── Coaching Screen ─────────────────────────────────────────────
  return (
    <div style={{height:'100vh',display:'flex',flexDirection:'column',position:'relative',background:C.navy}}>
      <div style={noiseBg}/>

      {/* Top bar */}
      <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',padding:'11px 18px',flexShrink:0,background:'rgba(8,15,30,0.95)',backdropFilter:'blur(16px)',borderBottom:'1px solid rgba(201,168,76,0.12)',position:'relative',zIndex:2}}>
        <button onClick={resetToIntro} style={{background:'transparent',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:6,fontFamily:"'DM Mono','Courier New',monospace",fontSize:10,letterSpacing:'0.16em',textTransform:'uppercase',color:C.muted,padding:0,transition:'color 0.2s'}}
          onMouseEnter={e=>e.currentTarget.style.color=C.white}
          onMouseLeave={e=>e.currentTarget.style.color=C.muted}>
          <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2}><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Scenarios
        </button>
        <div style={{width:1,height:18,background:'rgba(61,135,204,0.2)'}}/>
        <GCLogo size={26}/>
        <span style={{padding:'3px 10px',border:`1px solid ${scenario.phaseColor}40`,background:`${scenario.phaseColor}18`,fontFamily:"'DM Mono','Courier New',monospace",fontSize:9,letterSpacing:'0.16em',textTransform:'uppercase',color:scenario.phaseColor}}>{scenario.phase}</span>
        <span style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:15,fontWeight:700,color:C.white,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{scenario.title}</span>
        <VerdictBadge verdict={verdict}/>
        <span style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:9,color:C.muted}}>Turn {turns}</span>
      </div>

      {/* Main area */}
      <div style={{flex:1,display:'flex',overflow:'hidden',position:'relative',zIndex:1}}>

        {/* Chat */}
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          <div ref={chatRef} style={{flex:1,overflowY:'auto',padding:'22px 22px 8px',display:'flex',flexDirection:'column'}}>
            {messages.length===0&&loading&&<TypingIndicator/>}
            {messages.map((m,i)=>(
              <Bubble key={i} role={m.role} content={m.content} coachNote={showNotes?coachNotes[i]:null}/>
            ))}
            {messages.length>0&&loading&&<TypingIndicator/>}
            {gateOpen&&<AfLGate scenario={scenario} onReset={resetToIntro}/>}
            {error&&(
              <div style={{padding:'12px 16px',marginBottom:16,background:C.errorBg,border:`1px solid rgba(239,68,68,0.25)`,borderLeft:`3px solid ${C.error}`,fontFamily:"'DM Mono','Courier New',monospace",fontSize:11,color:'#FCA5A5',lineHeight:1.7}}>
                {error}
              </div>
            )}
          </div>

          {!gateOpen&&(
            <div style={{padding:'13px 18px',flexShrink:0,background:'rgba(8,15,30,0.92)',borderTop:'1px solid rgba(61,135,204,0.12)'}}>
              <div style={{display:'flex',gap:10,alignItems:'flex-end',background:'rgba(10,22,40,0.8)',border:'1px solid rgba(61,135,204,0.2)',padding:'10px 13px'}}>
                <textarea ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKey}
                  placeholder="Your response to the coach…" rows={1}
                  style={{flex:1,background:'transparent',border:'none',color:C.text,fontFamily:"'DM Sans','Segoe UI',sans-serif",fontSize:14,fontWeight:300,lineHeight:1.65,resize:'none',padding:0,maxHeight:140,overflowY:'auto'}}/>
                <button onClick={sendMessage} disabled={!input.trim()||loading}
                  style={{flexShrink:0,width:36,height:36,background:(!input.trim()||loading)?'rgba(201,168,76,0.2)':C.gold,border:'none',display:'flex',alignItems:'center',justifyContent:'center',transition:'background 0.2s,transform 0.15s',cursor:(!input.trim()||loading)?'not-allowed':'pointer'}}
                  onMouseEnter={e=>{if(input.trim()&&!loading){e.currentTarget.style.background=C.goldL;e.currentTarget.style.transform='translateY(-1px)';}}}
                  onMouseLeave={e=>{e.currentTarget.style.background=(!input.trim()||loading)?'rgba(201,168,76,0.2)':C.gold;e.currentTarget.style.transform='translateY(0)';}}>
                  <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke={(!input.trim()||loading)?C.goldD:C.navy} strokeWidth={2.5}><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
              </div>
              <div style={{marginTop:5,fontFamily:"'DM Mono','Courier New',monospace",fontSize:9,color:'rgba(168,200,232,0.25)',letterSpacing:'0.1em'}}>
                ENTER to send · SHIFT+ENTER for new line
              </div>
            </div>
          )}
        </div>

        {/* Sidebar */}
        <div style={{width:184,flexShrink:0,background:'rgba(8,15,30,0.75)',borderLeft:'1px solid rgba(61,135,204,0.1)',padding:'22px 14px',display:'flex',flexDirection:'column',gap:22,overflowY:'auto'}}>
          <div>
            <div style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:9,fontWeight:500,letterSpacing:'0.2em',textTransform:'uppercase',color:C.steel,marginBottom:12}}>Mastery Score</div>
            <MasteryMeter score={mastery} threshold={scenario.masteryThreshold} verdict={verdict}/>
          </div>

          <div style={{padding:'11px',background:mastery>=scenario.masteryThreshold?'rgba(34,197,94,0.07)':'rgba(10,22,40,0.5)',border:`1px solid ${mastery>=scenario.masteryThreshold?'rgba(34,197,94,0.3)':'rgba(61,135,204,0.12)'}`,transition:'all 0.5s'}}>
            <div style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:8,fontWeight:500,letterSpacing:'0.18em',textTransform:'uppercase',color:mastery>=scenario.masteryThreshold?C.green:C.muted,marginBottom:6}}>AfL Gate</div>
            <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:12,fontWeight:700,lineHeight:1.35,marginBottom:5,color:mastery>=scenario.masteryThreshold?C.white:C.muted}}>{scenario.afl}</div>
            <div style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:9,color:mastery>=scenario.masteryThreshold?C.green:C.muted}}>{mastery}/{scenario.masteryThreshold} required</div>
          </div>

          <div style={{padding:'11px',background:'rgba(10,22,40,0.5)',border:'1px solid rgba(61,135,204,0.1)',opacity:mastery>=scenario.masteryThreshold?1:0.35,transition:'opacity 0.5s'}}>
            <div style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:8,fontWeight:500,letterSpacing:'0.16em',textTransform:'uppercase',color:C.goldD,marginBottom:6}}>Unlocks</div>
            <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:12,fontWeight:700,color:C.white,lineHeight:1.35}}>{scenario.summativeUnlock}</div>
          </div>

          <KolbTracker mastery={mastery}/>

          <div style={{padding:'10px 11px',background:'rgba(201,168,76,0.04)',border:'1px solid rgba(201,168,76,0.12)',borderLeft:`2px solid ${C.goldD}`}}>
            <div style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:8,color:C.goldD,lineHeight:1.65,letterSpacing:'0.03em'}}>
              The coach updates mastery after every response. The AfL gate opens only when the coach is satisfied — not when you decide you are ready.
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
